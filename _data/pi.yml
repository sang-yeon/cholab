bio: |
  Professor Cho develops creative nanobiophotonic tools that harness the multiplexing power of light to study dynamic biological systems and advance biomedical and semiconductor photonic technologies.

  His research focuses on nanolaser particles, optical barcoding, single-cell tracking, and translational photonic technologies for understanding complex biological systems.

